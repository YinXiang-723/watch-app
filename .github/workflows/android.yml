name: build-watch-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时需要创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再依赖 android-actions/setup-android：
      # GitHub 的 ubuntu 镜像本来就预装 Android SDK，直接复用 + sdkmanager 补装更稳。
      - name: Ensure Android SDK 34
        run: |
          set -x
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          ls "$SDK" 2>/dev/null || true
          ls "$SDK/platforms" 2>/dev/null || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(command -v sdkmanager || true)"
          fi
          echo "SM=$SM"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0"
          fi
          ls "$SDK/platforms" 2>/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # 失败时把完整构建日志推到 ci-logs 分支，便于在没登录的情况下排查
      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p docs
          if [ -f build.log ]; then cp build.log docs/ci-build.txt; else echo "build.log missing" > docs/ci-build.txt; fi
          git add -f docs/ci-build.txt
          git commit -m "ci: build log for run ${GITHUB_RUN_ID}" || true
          git push -f origin ci-logs

      - name: Show APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Copy APK to workspace
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/app-debug.apk
          sha256sum dist/app-debug.apk

      - name: Upload dist (for release)
        uses: actions/upload-artifact@v4
        with:
          name: dist-apk
          path: dist/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: dist-apk
          path: dist

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release create "${GITHUB_REF_NAME}" dist/app-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated build from ${GITHUB_SHA}" \
            --latest
